[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "teateret-beslutningsbrief"
version = "0.1.0"
description = "Kildebelagt beslutningsbrief for Teateret."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.107,<1",
  "httpx>=0.28,<1",
  "Jinja2>=3.1,<4",
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ingest = [
  "duckdb>=1.4,<2",
  "trafilatura>=2,<3",
]
google = ["pytrends>=4.9,<5"]
dev = ["pytest>=9,<10"]

[project.scripts]
teateret-brief = "teateret_brief.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

